name: EGI development checks
on:
  pull_request:
    branches: [dev]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    name: EGI / reviewer
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EGI_DEVTOOLS_SOURCE: ${{ github.workspace }}/.local/devtools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Resolve exact canonical tooling
        id: tools
        run: python -c "import json,os; p=json.load(open('.checks/tool-source.json')); open(os.environ['GITHUB_OUTPUT'],'a').write('revision='+p['revision']+'\n')"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: duck-spaghetti/egi-app
          ref: ${{ steps.tools.outputs.revision }}
          path: .local/devtools
          persist-credentials: false
      - name: Install existing reproducible build prerequisites
        run: python -m pip install setuptools==75.1.0 wheel==0.43.0
      - name: Validate actual PR commit objects
        env:
          EGI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/commit_guard.py range "$EGI_BASE_SHA" HEAD
      - name: Run owning Complete profile
        run: python scripts/check.py --profile complete --json > .local/ci-report.json
      - name: Controlled negative CI proof
        run: exit 1
      - name: Retain identified reports and artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reviewer-${{ github.event.pull_request.head.sha }}
          path: |
            .local/ci-report.json
            .local/wheel-last.json
            .local/wheel-last.log
            .local/artifacts/*.whl
          if-no-files-found: error
